# Pregunta que corte de la fuente esta publicado, y avisa cuando cambia.
#
# Vive en GitHub Actions y no en el DAG de Airflow por una razon concreta: el
# DAG corre en una maquina que se apaga, y esto tiene que funcionar de noche y
# los fines de semana. El registro de cadencia es el unico insumo del proyecto
# que no se recupera hacia atras.
name: Sondeo de la fuente

on:
  schedule:
    # Cada tres horas, en UTC. Colombia es UTC-5, asi que estas ocho caen a las
    # 20, 23, 02, 05, 08, 11, 14 y 17 hora colombiana.
    #
    # El offset no es casual: las tres regeneraciones conocidas ocurrieron entre
    # las 04:06 y las 04:41 COT, y el sondeo de las 10:00 UTC cae a las 05:00
    # COT, unos veinte minutos despues de la mas tardia. Con tres observaciones
    # esa ventana no es una ley, por eso se sigue preguntando las otras siete
    # veces.
    - cron: "0 1-23/3 * * *"
  # Y a mano, para probarlo sin esperar tres horas.
  workflow_dispatch:

permissions:
  contents: write   # para anotar la linea del dia
  issues: write     # para avisar cuando la fuente se mueve

# Dos sondeos a la vez pelearian por el mismo archivo y por el push.
concurrency:
  group: sondeo
  cancel-in-progress: false

jobs:
  sondear:
    name: Que corte esta publicado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Preguntar
        id: sondeo
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          set +e
          uv run python scripts/sondear.py
          codigo=$?
          set -e
          # 0 = no se movio, 5 = regenero. Los dos son respuestas correctas y
          # ninguno es un fallo: es el mismo criterio por el que el cargador
          # devuelve 4 en vez de 1. Cualquier otro codigo si aborta.
          if [ "$codigo" -ne 0 ] && [ "$codigo" -ne 5 ]; then
            echo "El sondeo fallo con codigo $codigo"
            exit "$codigo"
          fi

      # Que columnas declara la fuente. Va en el mismo job y no en uno propio a
      # proposito: dos jobs del mismo workflow corren en paralelo y los dos
      # empujarian al mismo branch, que es una carrera. Aca hay un solo commit.
      #
      - name: Preguntar por las columnas
        id: columnas
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          set +e
          uv run python scripts/vigilar_columnas.py
          codigo=$?
          set -e
          # 0 = el esquema no se movio, 5 = cambio. Mismo criterio que arriba.
          if [ "$codigo" -ne 0 ] && [ "$codigo" -ne 5 ]; then
            echo "El vigia de columnas fallo con codigo $codigo"
            exit "$codigo"
          fi

      - name: Anotar lo que cambio
        # Solo cuando hay algo que guardar. Sin esto serian ocho commits diarios.
        if: >
          steps.sondeo.outputs.guardar == 'true' ||
          steps.columnas.outputs.guardar_columnas == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/cadencia.csv exploration/columnas_de_la_fuente.txt
          if git diff --staged --quiet; then
            echo "Nada cambio."
          else
            if [ "${{ steps.columnas.outputs.columnas_cambio }}" = "true" ]; then
              mensaje="sondeo: cambiaron las columnas de la fuente"
            else
              mensaje="sondeo: corte ${{ steps.sondeo.outputs.corte }}"
            fi
            git commit -m "$mensaje"
            git push
          fi

      - name: Avisar que la fuente regenero
        if: steps.sondeo.outputs.regenero == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "La fuente regenero: corte ${{ steps.sondeo.outputs.corte }}" \
            --body "El corte publicado cambio. Hay una observacion nueva que se
          pierde si la fuente vuelve a regenerar antes de ingerirla.

          Para cargarla:

              uv run python scripts/cargar_raw.py --flujo vivos

          Son unos cincuenta minutos y corre desatendido: los reintentos absorben
          un 429 pasajero. Al terminar, regenerar el tablero para que la tira de
          cadencia y el conteo de dias queden al dia.

          Corte nuevo: \`${{ steps.sondeo.outputs.corte }}\`"

      # Un aviso aparte del anterior, y mas urgente de lo que parece: mientras
      # una columna nueva siga sin clasificar, cada regeneracion de la fuente
      # que se ingiera la pierde para siempre. La fuente se sobrescribe.
      - name: Avisar que cambiaron las columnas
        if: steps.columnas.outputs.columnas_cambio == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Por variable de entorno y no interpolados en el script: estos
          # nombres los elige la fuente, no nosotros. Un `${{ }}` se sustituye
          # ANTES de que bash lea la linea, asi que un nombre con comillas
          # dejaria de ser un dato y pasaria a ser codigo.
          APARECIERON: ${{ steps.columnas.outputs.aparecieron }}
          SE_FUERON: ${{ steps.columnas.outputs.se_fueron }}
        run: |
          gh issue create \
            --title "Cambio el esquema de la fuente" \
            --body "El endpoint de metadatos declara columnas distintas a las de
          la ultima observacion.

          Aparecieron: \`$APARECIERON\`
          Se fueron: \`$SE_FUERON\`

          **Si aparecio una columna:** el \`\$select\` no la pide, asi que no
          entra a raw y no se recupera despues. Hay que clasificarla a mano en
          \`src/secop_analytics/columnas.py\` (material, cosmetica, imposible o
          excluida por dato personal) y regenerar el macro de dbt:

              uv run python scripts/generar_columnas_dbt.py

          **Si se fue una columna:** el \`\$select\` la sigue nombrando y la
          proxima corrida del cargador se va a caer con HTTP 400.

          Este aviso sale una sola vez por cambio. El registro ya quedo
          actualizado, asi que el proximo sondeo no lo repite; el problema sigue
          reportandose en el log de cada corrida hasta que se arregle."
