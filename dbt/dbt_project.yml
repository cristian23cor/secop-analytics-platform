# Proyecto dbt de SECOP. Ver `exploration/03_decisiones_capa_raw.md` (D9) y
# `01_modelo_dimensional.md` (el diseño de las capas).
#
# La portabilidad entre motores se logra porque nada aquí es motor-específíco.
#
# El proyecto tiene dos objetivos: `dev` sobre DuckDB local y `snowflake`. La
# diferencia vive entera en `profiles.yml` y en un solo modelo, el que toca los
# archivos. Así, cualquier cosa motor-específica que se cuele acá se propagaría
# a toda la reescritura, que es exactamente lo que D9 quería evitar.
#
# La arquitectura sostiene que `dbt run --target snowflake` no toca este archivo:
# nada aquí cambia por el motor.

name: secop
version: "0.1.0"
profile: secop

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Dónde vive raw. Solo lo usa el modelo frontera; en Snowflake se sustituye
  # por la ruta del stage. El resto de los modelos no necesita saberlo.
  ruta_raw: "../datos/raw"

models:
  secop:
    staging:
      +materialized: view
      # El modelo frontera es la excepción. Se materializa como tabla para que
      # los archivos se lean una sola vez por corrida, no una vez por cada modelo
      # que dependa de ellos. Lo declara en su propio archivo.
      +schema: staging

    intermediate:
      # La capa donde vive la lógica de negocio: derivar columnas y comparar
      # observaciones. Tabla y no vista porque el hecho la consulta por filtros
      # muy selectivos —"las versiones que cambiaron el plazo"— y una vista
      # rehace el join contra 2,9 millones de filas cada vez.
      +materialized: table
      +schema: intermediate