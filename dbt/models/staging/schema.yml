version: 2

# Tests de la capa staging.
#
# ## Qué hace distinto a este archivo
#
# Cada test de acá nace con un resultado ya medido sobre las 2.902.163 observaciones
# reales: la regla y el número de incumplimientos que da hoy, juntos.
#
# Un test que arranca en verde avisa cuando algo se rompe. Uno que arranca con N
# incumplimientos conocidos avisa cuando N cambia, y esa es la señal útil en una fuente
# que se sobrescribe y de la que no controlamos nada.
#
# ## Por qué casi todo es `warn` y no `error`
#
# Tres de estos tests fallan hoy con datos que ya están en disco. Como `error`, la
# construcción quedaría roja desde el primer día por motivos que no dependen de
# nosotros, y una suite roja permanente enseña a ignorar los tests. Ahí se pierde la
# capacidad de detectar el fallo que sí importa. El mismo argumento dejó
# `referencia_del_contrato` fuera de las columnas imposibles: una alerta ruidosa es peor
# que no tener alerta.
#
# `error` queda para lo que, si falla, significa que el pipeline está roto y no que la
# fuente esté sucia.
#
# ## Lo que no está acá, a propósito
#
# RN1, que las seis fuentes de financiación sumen `valor_del_contrato`, falla en 93.557
# filas, el 3,31%, por motivos que todavía no se separaron. Está en la pregunta abierta
# 13 del inventario. Meterla hoy sería garantizar que nadie mire los resultados de esta
# suite.

models:

  - name: raw_observaciones
    description: >
      Este es el modelo frontera: el único que toca los archivos de raw. El resto de
      los modelos lee esta tabla y no necesita saber que la fuente vive en disco. Las
      67 columnas salen como texto, sin castear ni limpiar.
    columns:
      - name: hash
        description: >
          Hash de los bytes canónicos de la observación, calculado en la ingesta (I1).
          Es la pieza que sostiene la deduplicación de D3.
        data_tests:
          - not_null:
              config:
                severity: error
                # Si esto falla, raw está corrupto o el modelo frontera está leyendo mal.
                # Las dos cosas son fallos nuestros, no de la fuente, y por eso acá sí es
                # `error`.

  - name: stg_contratos
    description: >
      Aquí quedan las 67 columnas casteadas, con los centinelas convertidos a nulo y
      `urlproceso` aplanado. Es la capa donde se paga lo que D1 dejó para después.
    columns:

      - name: id_contrato
        description: >
          Llave del contrato. No es única en esta tabla y no debería serlo: hay
          2.902.163 observaciones de contratos que se repiten entre particiones, y esa
          repetición es parte del proyecto. Lo único que es único es la combinación con
          la observación.
        data_tests:
          - not_null:
              config:
                severity: error
                # Sin `id_contrato` la fila no se puede deduplicar ni unir con nada. La
                # ingesta ya lo rechaza en `preparar()`, así que si aparece uno nulo acá,
                # el problema está en el camino hacia dbt.

      - name: castings_fallidos
        description: >
          Cuántas de las 25 columnas tipadas tenían valor y no se pudieron castear.
          Mide la forma del dato, no su verdad.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: valor_del_contrato
        description: >
          La columna que justifica el proyecto. Tiene basura de dos clases y solo una la
          atrapa el sistema de tipos. RN13 vive en `tests/rn13_valor_imposible.sql`,
          escrita a mano en lugar de con `dbt_utils.accepted_range`: el umbral necesita
          explicar de dónde sale la cifra, y una dependencia externa menos es una cosa
          menos que reinstalar el día del porte.

# ---------------------------------------------------------------------------
# Tests singulares: van en `tests/` porque expresan relaciones entre columnas,
# que los tests genéricos de dbt no cubren.
#
#   tests/rn12_liquidacion_sin_inicio.sql
#   tests/rn13_valor_imposible.sql
#   tests/castings_fallidos_no_subieron.sql
# ---------------------------------------------------------------------------